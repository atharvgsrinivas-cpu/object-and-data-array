<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>


    <script>
  // Simple object
  var student = {
    name: 'Riya',
    age: 12,
    grade: 7,
    hobbies: 'Drawing',
    fav_sport: 'Cricket'
  };

  // Simple array
  var colors = ["white", "black", "red", "green", "blue"];

  document.write("Student name is: " + student.name + "<br>");
  document.write("Student favorite sport is: " + student.fav_sport + "<br>");
  document.write("Before popping, colors are: " + colors.join(", ") + "<br>");
  document.write("My favorite color is: " + colors[3] + "<br>");
  colors.pop();
  document.write("After popping, colors are: " + colors.join(", "));
    </script>
  </body>
</html>
